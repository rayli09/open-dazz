[package]
name = "openfuji-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Film simulation engine core: recipes + 3D LUTs, native and WASM."

[dependencies]
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ntsc-rs = { path = "../ntsc-rs", default-features = false, features = ["std"] }

# Multithreaded ntsc-rs on native builds (the video path is the
# slow one); wasm32 keeps the single-thread fallback since
# rayon-core does not build for it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ntsc-rs = { path = "../ntsc-rs", features = ["rayon"] }

[dev-dependencies]
palette = "0.7"
