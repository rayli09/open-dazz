[package]
name = "openfuji-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings for openfuji-core (web app)."

[lib]
crate-type = ["cdylib"]

[dependencies]
openfuji-core = { path = "../openfuji-core" }
wasm-bindgen = "0.2"
serde_json = { workspace = true }
image = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
