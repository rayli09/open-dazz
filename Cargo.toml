[workspace]
resolver = "2"
members = ["crates/opendazz-core", "crates/opendazz-cli", "crates/opendazz-wasm", "crates/ntsc-rs"]

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
