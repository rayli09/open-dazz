name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Frontend install entry uses the root lockfile
        run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun test
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
        env:
          # GitHub runners get HTTP 403 from the public LUT host's Cloudflare
          # challenge even when the manifest is published, and CI artifacts
          # are never deployed. The Vercel production build remains the
          # strict gate (authenticated R2 verification in vite.config.ts).
          OPENDAZZ_SKIP_LUT_VERIFY: '1'
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo test --locked --workspace --exclude opendazz-desktop
      - run: cargo clippy --locked --workspace --exclude opendazz-desktop -- -D warnings
      - name: Core must stay WASM-clean
        run: cargo build --locked -p opendazz-core --target wasm32-unknown-unknown
      - name: Install matching wasm-bindgen generator
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Generated WASM declarations must match Rust
        run: tools/check-wasm-declarations.sh
