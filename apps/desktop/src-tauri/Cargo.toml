[package]
name = "opendazz-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
name = "opendazz_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-photos = { path = "../../../crates/tauri-plugin-photos" }
tauri-plugin-ios-ui = { path = "../../../crates/tauri-plugin-ios-ui" }

[features]
smoke-test = []
