<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var t = localStorage.getItem("of-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (t === "dark") document.documentElement.dataset.theme = "dark";
        document.documentElement.dataset.mode = localStorage.getItem("of-mode") === "pro" ? "pro" : "simple";
      } catch (e) {}
    </script>
    <title>open-fuji — Photo Workshop</title>
    <meta name="description" content="An open film-simulation workshop: 600+ film looks, a Rust engine in WebAssembly, everything developed locally in your browser." />
    <link rel="icon" type="image/png" href="/logo-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2ecdc" />
    <meta name="theme-color" content="#f2ecdc" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app" class="h-dvh flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  <script>
  // Independent watchdog: if the app bundle stalls, say so on screen.
  setTimeout(function () {
    var sl = document.querySelector("#stage-load");
    if (sl && !sl.classList.contains("hidden")) {
      var t = sl.querySelector("div");
      if (t) t.textContent = "STILL LOADING — the app bundle or data did not arrive. Try a hard reload.";
    }
    if (!document.querySelector(".look-card")) {
      var cab = document.querySelector("#cabinet");
      if (cab && cab.querySelector(".skel")) cab.insertAdjacentHTML("beforeend", '<div class="px-3 py-3 font-mono text-[11px]" style="color:#a83c26">Still loading — if this persists, the bundle did not arrive.</div>');
    }
  }, 20000);
</script>
</body>
</html>
