[package]
name = "opendazz-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
[features]
smoke-test = []
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
